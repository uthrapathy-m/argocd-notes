# CI for the APP repo: build an immutable image and publish it. It never deploys.
# Trigger: push a tag like v1.0.0  (or run it manually from the Actions tab).
name: build-and-push

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read # least privilege: this job only needs to read the code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (read/write token, CI only)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/app1
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          # no mutable "latest" tag: metadata-action adds it on tag pushes by default
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show the immutable digest
        run: |
          {
            echo "### Image published"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest (use this in prod manifests): \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
