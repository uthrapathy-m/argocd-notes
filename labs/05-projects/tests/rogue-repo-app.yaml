# Test 2: a repo the project does not trust.
# Points app1-project at your lecture 04 repo (Argo CD CAN read it: the deploy key exists),
# but app1-project's sourceRepos doesn't list it.
# Expect: InvalidSpecError "application repo ... is not permitted in project 'app1-project'".
# Nothing is deployed. Apply it by hand, observe, then delete it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1-rogue-repo
  namespace: argocd
spec:
  project: app1-project
  source:
    repoURL: git@github.com:<GITHUB_USER>/app1-config.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: app1-ns
