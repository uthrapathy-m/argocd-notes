# Lecture 03, Lab 3F: same Git path, different namespace, namespace created by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true     # a sync option, NOT auto-sync: you still click Sync
