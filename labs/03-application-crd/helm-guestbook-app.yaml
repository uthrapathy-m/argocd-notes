# Lecture 03, Lab 3I answer: Argo CD detects Chart.yaml in the path and renders it as Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-gb
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
